# Zona de reenvio de Unbound.
#
# Importante y honesto: con este archivo Unbound NO hace recursion propia;
# reenvia las consultas al resolver que elijas (por defecto Cloudflare).
# Es el modo que trae la imagen y el mas estable para uso domestico.
#
# Para recursion pura (sin terceros): vacia este archivo (deja solo comentarios)
# y Unbound resolvera desde los root servers con DNSSEC (la imagen genera el
# root.key al arrancar). Probala antes de confiar en ella: algunas redes
# bloquean el puerto 53 saliente y la recursion se degrada.

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    # Alternativa (Quad9):
    # forward-addr: 9.9.9.9
    # forward-addr: 149.112.112.112
