# Perfil de latencia baja para HLS en vivo (libmpv).
#
# Trade-off: arranca en el borde y bufferea menos, asi que puede cortar
# cuando el origen publica el siguiente segmento tarde. Usar solo si el
# origen es estable; para el uso diario esta `mpv.conf` (18 s).
#
# Instalar con:
#   powershell -File scripts/mpv-latency.ps1 -Mode low
# Volver al perfil estable:
#   powershell -File scripts/mpv-latency.ps1 -Mode stable

demuxer-lavf-o=live_start_index=-1
cache=yes
cache-secs=8
demuxer-readahead-secs=8
demuxer-max-back-bytes=24MiB
cache-pause=yes
cache-pause-wait=1
hls-bitrate=max
