# Low-latency live HLS settings for AIOStreams Desktop (libmpv).
#
# The desktop app keeps its own options for hwdec, audio and
# demuxer-max-bytes; the values below are read on every start and are not
# overwritten by the app.
#
# Why this exists:
# - A live HLS playlist is a sliding window. By default mpv starts a few
#   segments before the end; when the origin keeps a long DVR window, that
#   can put the picture minutes behind the match.
# - live_start_index=-2 starts two segments before the newest one, so the
#   player opens near the live edge even if the window is large.
# - cache-secs caps read-ahead. Without it, the app's large
#   demuxer-max-bytes can build a long buffer that never drains.
# - 18 s of cache is a compromise: -1 starts faster but stalls more often
#   when the free source publishes the next segment late.

demuxer-lavf-o=live_start_index=-2
cache=yes
cache-secs=18
demuxer-readahead-secs=15
demuxer-max-back-bytes=32MiB
cache-pause=yes
cache-pause-wait=2
hls-bitrate=max
